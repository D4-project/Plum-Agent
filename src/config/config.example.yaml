# Output: none = errors only, info = agent summaries, debug = full diagnostics.
# CLI -v shows agent status and scanner output. -vv enables full diagnostics.
debug: none
# debug: info
# debug: debug

# Tools found on PATH are enabled automatically. Uncomment to disable one.
# nmap_disabled: true
# masscan_disabled: true

# Maximum packets per second for Masscan. Default: 1000.
# masscan_rate: 1000

# To pause scanning with the current agent, uncomment this line.
# scanparallel: 0
# Masscan IPv4/IPv6 capability is detected from external connectivity at startup.
# Dedicated source addresses for Masscan banner detection. Each is optional.
# Assign a matching family address to the network without adding it to a kernel interface.
# masscan_ip_v4: 192.0.2.10
# masscan_ip_v6: 2001:db8::10
